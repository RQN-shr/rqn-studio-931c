<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>R.QueenNail 勤怠・給与</title>
<style>
:root{--blue:#85C8FE;--ink:#55758A;--pale:#DCEFFF}*{box-sizing:border-box}body{margin:0;background:#f8fcff;color:var(--ink);font:16px/1.7 system-ui,sans-serif}header,main{max-width:980px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;letter-spacing:.12em}h1{font-size:26px;margin:6px 0 18px}h2{font-size:20px}h3{font-size:17px}section,.card{background:white;border:1px solid var(--pale);border-radius:20px;padding:22px;margin-bottom:18px}button,input,select,textarea{font:inherit;color:inherit;border:1px solid #c9e1f2;border-radius:10px;min-height:48px;padding:10px;max-width:100%}button{background:var(--blue);font-weight:600;cursor:pointer}button.secondary{background:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}input,select,textarea{width:100%;background:white}label{display:block;margin:12px 0}label span{display:block;font-size:14px;margin-bottom:4px}nav{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}nav button{white-space:nowrap;background:white}nav button.active{background:var(--pale);border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.punch button{min-height:100px;font-size:20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.toolbar>*{flex:1;min-width:120px}.muted,small{font-size:13px}.badge{display:inline-block;background:var(--pale);border-radius:6px;padding:2px 7px;font-size:12px;margin:2px}.flag{border:1px solid var(--ink);background:#DCEFFF;font-weight:700}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--pale);padding:10px;white-space:nowrap}#message{position:sticky;top:0;z-index:3;background:var(--pale);padding:12px 20px;display:none;white-space:pre-wrap}#message.error{border:2px solid var(--ink)}.big{font-size:42px;font-weight:600;line-height:1.4}.calendar{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;min-width:800px}.calendar label{padding:8px;border:1px solid var(--pale);margin:0}.calendar input{font-size:13px;padding:4px}.pay dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay dd{text-align:right;margin:0}.pay dt{margin:0}.pay .total{font-weight:bold;border-top:2px solid var(--blue);padding-top:10px}footer{text-align:center;font-size:12px;padding:28px}a{color:var(--ink)}@media(max-width:520px){header,main{padding:14px}section,.card{padding:18px}h1{font-size:23px}.grid{gap:8px}}@media print{body{background:white}header,nav,#message,.controls,footer,#filters{display:none!important}main{max-width:none;padding:0}.pay{break-inside:avoid;border:1px solid #bbb;box-shadow:none}section:not(.pay){display:none}button{display:none!important}}

[hidden]{display:none!important}h2,h3,.card strong{font-weight:700}section,.card{padding:26px;margin-bottom:24px}h2{margin-top:0}.punch button:enabled{background:var(--blue);color:#36566b;border-color:var(--blue);box-shadow:0 4px 0 #68acd9,0 6px 12px #55758a18}.punch button:enabled:active{transform:translateY(2px);box-shadow:0 2px 0 #68acd9}.punch button:disabled{opacity:1;background:white;border-color:#e0e4e7;color:#afb7bd;box-shadow:none}.clock{text-align:center;margin-bottom:28px}.clock .big{font-size:64px;font-variant-numeric:tabular-nums}.records{margin:20px 0 28px}.records div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #edf2f5}.records dd{margin:0;text-align:right}.nav-wrap{position:relative}.nav-wrap.admin:after{content:'';position:absolute;right:0;top:0;bottom:12px;width:32px;background:linear-gradient(90deg,transparent,#f8fcff);pointer-events:none}.admin nav{scrollbar-width:none;padding-right:32px}.admin nav::-webkit-scrollbar{display:none}.staff nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:10px 6px calc(10px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--pale);box-shadow:0 -4px 18px #55758a0d;overflow:hidden}.staff nav button{padding:10px 2px;font-size:clamp(10px,2.8vw,14px);min-width:0;border-color:transparent}.staff nav button.active{border-color:#c9e1f2}body:has(.nav-wrap.staff){padding-bottom:calc(88px + env(safe-area-inset-bottom))}.kind{font-weight:700;margin:0 0 12px;padding:4px 10px}.kind.request{background:#e9eff8}.kind.transport{background:#e8f2ee;color:#59756a}.kind.day{background:#f3eee4;color:#847453}.reject{background:white;color:#b57676;border:1px solid #e9caca}.attachments{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}.card .toolbar{margin-top:20px}@media(max-width:520px){section,.card{padding:22px 18px}}@media print{.nav-wrap{display:none}body:has(.nav-wrap.staff){padding-bottom:0}}
</style></head><body><header><div><div class="brand">R.QueenNail</div><strong>勤怠と給与</strong></div><button id="logout" class="secondary" hidden>ログアウト</button></header><div id="message" role="status" aria-live="polite"></div><main><div id="login"><section style="max-width:440px;margin:30px auto"><h1>おつかれさまです</h1><p>ログインして、今日の勤務を記録しましょう。</p><form id="loginForm"><label><span>ログインID</span><input name="staffId" autocomplete="username" required></label><label><span>暗証番号</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="current-password" required></label><button style="width:100%">ログイン</button></form><p class="muted">IDはオーナーからお知らせします。</p></section></div><div id="app" hidden><h1 id="greeting"></h1><div id="navWrap" class="nav-wrap"><nav id="nav" aria-label="メニュー"></nav></div><div id="filters" class="toolbar"><label><span>表示する月</span><input id="month" type="month"></label><button id="refresh" class="secondary">更新</button></div><div id="view"></div></div></main><footer>R.QueenNail · 毎日の記録を、ていねいに。</footer>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxuM7f1SNa076r9ttCjP0SnbBvW3jAHijuxuYk91T6CZnFrF35hjFDCaTnXsifDP0-r7w/exec'; // デプロイした https://script.google.com/macros/s/.../exec を設定
</script><script id="calculation">
const Calc = (() => {
  const minute = t => { if (!t) return null; const p=t.split(':').map(Number); return p[0]*60+p[1]; };
  const span = (a,b) => { a=minute(a); b=minute(b); return a===null||b===null?0:(b<a?b+1440:b)-a; };
  function intervals(d) {
    if(!d.start||!d.end) return [];
    let a=minute(d.start), b=a+span(d.start,d.end), list=[[a,b]];
    (d.breaks||[]).forEach(r=>{if(!r[1]) return; let x=minute(r[0]); if(x<a)x+=1440;let y=x+span(r[0],r[1]);list=list.flatMap(([s,e])=>x>=e||y<=s?[[s,e]]:[[s,Math.max(s,x)],[Math.min(e,y),e]].filter(z=>z[1]>z[0]));});return list;
  }
  const worked=d=>intervals(d).reduce((n,[a,b])=>n+b-a,0);
  const night=d=>intervals(d).reduce((n,[a,b])=>{for(let t=a;t<b;t++)if(t%1440<300||t%1440>=1320)n++;return n;},0);
  function flags(d,shift,cutoff,now){const f=[...new Set(d.locationFlags||[])], w=worked(d), rest=span(d.start,d.end)-w;
    if((w>360&&rest<45)||(w>480&&rest<60))f.push('休憩不足');
    if(d.start&&(!shift||Math.abs(minute(d.start)-minute(shift.start))>=15||(d.end&&Math.abs(minute(d.end)-minute(shift.end))>=15)))f.push('シフトずれ');
    if(d.start&&!d.end&&now>=d.date+'T'+cutoff)f.push('退勤忘れ');return f;
  }
  function rate(rows,month){const r=rows.filter(x=>x.month<=month).sort((a,b)=>b.month.localeCompare(a.month))[0];if(!r)throw Error('適用する時給が未設定です');return Number(r.rate);}
  function tax(amount,kind,rows){const matches=rows.filter(r=>r.kind===kind&&amount>=Number(r.min)&&(r.max===''||r.max==null||amount<Number(r.max)));if(matches.length!==1)throw Error('源泉税額表が未入力、または範囲が重複しています');const r=matches[0];return Math.floor(Number(r.tax||0)+amount*Number(r.rate||0));}
  function payDate(month,holidays){let [y,m]=month.split('-').map(Number),d=new Date(Date.UTC(y,m,15));while([0,6].includes(d.getUTCDay())||holidays.includes(d.toISOString().slice(0,10)))d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}
  function payroll(o){let minutes=0,days=0,ot=0,deep=0,paid=0,closed=0;const weeks={};
    o.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>{let w=worked(d),dt=new Date(d.date+'T00:00:00Z');dt.setUTCDate(dt.getUTCDate()-dt.getUTCDay());let key=dt.toISOString().slice(0,10),regular=Math.min(w,480),previous=weeks[key]||0;weeks[key]=previous+regular;
      if(!d.date.startsWith(o.month))return;minutes+=w;if(w)days++;ot+=Math.max(0,w-480)+Math.max(0,previous+regular-2400)-Math.max(0,previous-2400);deep+=night(d);
      if(d.type==='有給')paid+=span(d.shiftStart,d.shiftEnd)*o.rate/60;
      if(d.type==='会社都合の休業'){if(o.history&&o.history.length===3){let wages=o.history.reduce((s,h)=>s+h.wages,0),cal=o.history.reduce((s,h)=>s+h.calendarDays,0),work=o.history.reduce((s,h)=>s+h.days,0);closed+=Math.max(wages/cal,work?wages/work*.6:0)*.6;}else{if(d.allowance==null||d.allowance==='')throw Error('休業手当を手入力してください');closed+=Number(d.allowance);}}
    });
    const base=Math.ceil(minutes*o.rate/60),premium=Math.ceil((ot+deep)*o.rate/60*.25),transport=Math.min(o.transportCap,o.transport),commission=Number(o.commission||0),adjustment=Number(o.adjustment||0),resident=Number(o.resident||0);
    paid=Math.ceil(paid);closed=Math.ceil(closed);const gross=base+premium+paid+closed+commission+adjustment+transport,withholding=tax(gross-transport,o.taxKind,o.taxRows);
    return {days,minutes,base,premium,closed,paid,commission,adjustment,transport,gross,withholding,resident,net:gross-withholding-resident,overtime:ot,night:deep};
  }
  function forecast(actual,shifts,rate,transport,cap,limit){const total=Math.ceil(actual+shifts.reduce((s,d)=>s+span(d.start,d.end)*rate/60,0))+Math.min(transport,cap);return {total,warning:total>limit};}
  return {minute,span,worked,night,flags,rate,tax,payDate,payroll,forecast};
})();
</script><script>
'use strict';
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('attendanceToken')||'', state=null, tab='打刻', busy=false;
const yen=n=>Number(n||0).toLocaleString('ja-JP')+' 円', hours=n=>Math.floor(n/60)+'時間'+n%60+'分';
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());$('#month').value=today().slice(0,7);
function dateLabel(value,year=false){const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return (year?m[1]+'年':'')+Number(m[2])+'月'+Number(m[3])+'日（'+'日月火水木金土'[d.getUTCDay()]+'）';}
function monthLabel(value){const m=String(value||'').match(/^(\d{4})-(\d{2})/);return m?m[1]+'年'+Number(m[2])+'月':'';}
const clockTime=()=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
function updateClock(){if(!state||tab!=='打刻')return;const clock=$('#currentTime'),date=$('#currentDate');if(clock)clock.textContent=clockTime();if(date)date.textContent=dateLabel(today());}
if(typeof window.setInterval==='function')window.setInterval(updateClock,1000);
function message(t,error=false){$('#message').textContent=t;$('#message').style.display=t?'block':'none';$('#message').classList.toggle('error',error);}
async function api(action,data={}){if(!GAS_URL)throw Error('接続先が未設定です。READMEの手順でGAS_URLを設定してください。');let res;try{res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data}),redirect:'follow'});}catch(e){throw Error('電波が弱いようです。もう一度押してください。打刻後の場合は、先に更新して記録を確認してください。');}if(!res.ok)throw Error('サーバーに接続できません。時間をおいて再度お試しください。');let r;try{r=await res.json();}catch(e){throw Error('接続先URLとGASの公開設定を確認してください。');}if(!r.ok)throw Error(r.error);return r.data;}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>{b.dataset.disabled=String(b.disabled);b.disabled=true;});try{await fn();}catch(e){message(e.message,true);}finally{busy=false;document.querySelectorAll('button[data-disabled]').forEach(b=>{b.disabled=b.dataset.disabled==='true';delete b.dataset.disabled;});}}
async function refresh(){state=await api('snapshot',{month:$('#month').value});$('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#greeting').textContent=state.me.name+' さん';render();}
const field=(label,name,type='text',value='',extra='')=>`<label><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
const select=(label,name,items,value)=>`<label><span>${label}</span><select name="${name}">${items.map(x=>`<option value="${esc(Array.isArray(x)?x[0]:x)}" ${(Array.isArray(x)?x[0]:x)===value?'selected':''}>${esc(Array.isArray(x)?x[1]:x)}</option>`).join('')}</select></label>`;
const staffSelect=(name='staffId',all=false)=>select('スタッフ',name,[...(all?[['','全員']]:[]),...(state.staff||[]).filter(s=>s.権限!=='管理者').map(s=>[s.ID,s.表示名])]);
const form=(action,body,label='保存')=>`<form data-action="${action}">${body}<button>${label}</button></form>`;
const nameOf=id=>state.staff?.find(s=>s.ID===id)?.表示名||id;
function render(){const tabs=state.me.admin?['ホーム','勤怠一覧','スタッフ','時給','シフト','給与計算','帳簿','設定']:['打刻','今月の勤怠','修正申請','交通費','給与明細'];if(!tabs.includes(tab))tab=tabs[0];$('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}" aria-current="${t===tab?'page':'false'}">${t}</button>`).join('');$('#navWrap').className='nav-wrap '+(state.me.admin?'admin':'staff');$('#filters').hidden=!state.me.admin&&!['今月の勤怠','給与明細'].includes(tab);$('#view').innerHTML=views[tab]();updateClock();}
function payCard(r,admin){const d=r.明細,labels={days:'勤務日数',minutes:'実働時間',base:'基本給',premium:'割増',closed:'休業手当',paid:'有給分',commission:'歩合',adjustment:'その他手当',transport:'交通費',gross:'総支給',withholding:'源泉所得税',resident:'住民税',net:'差引支給額'};return `<section class="pay"><h2>${esc(monthLabel(r.月))}分 給与明細 ${admin?esc(nameOf(r.スタッフID)):''}</h2><p>支払日 ${esc(dateLabel(d.payDate,true))} <span class="badge">${esc(r.状態)}</span></p><dl>${Object.entries(labels).map(([k,v])=>`<dt class="${k==='net'?'total':''}">${v}</dt><dd class="${k==='net'?'total':''}">${k==='minutes'?hours(d[k]):k==='days'?d[k]+'日':yen(d[k])}</dd>`).join('')}</dl>${admin?`<p>${esc(r.警告)}</p>${r.状態==='確定'?`<button data-revoke="${esc(r.ID)}">確定を取り消す</button>`:form('paySave',`<input type="hidden" name="id" value="${esc(r.ID)}">${field('歩合','commission','number',d.commission,'min="0" required')}${field('その他の手当（課税）','adjustment','number',d.adjustment,'min="0" required')}${field('住民税','resident','number',d.resident,'min="0" required')}${select('保存方法','finalize',[['false','下書き保存'],['true','確定してスタッフに公開']])}`)}`:''}<button class="secondary controls" data-print>印刷</button></section>`;}
function attendance(){return `<section><h2>${monthLabel(state.month)} の勤怠</h2><p>実働合計 <strong>${hours(state.days.reduce((n,d)=>n+Calc.worked(d),0))}</strong></p><div class="scroll"><table><thead><tr>${state.me.admin?'<th>スタッフ</th>':''}<th>日付</th><th>区分</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>印・承認</th></tr></thead><tbody>${state.days.sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<tr>${state.me.admin?`<td>${esc(nameOf(d.staffId))}</td>`:''}<td>${esc(dateLabel(d.date))}</td><td>${esc(d.type)}</td><td>${esc(d.start||'—')}</td><td>${esc(d.end||'—')}</td><td>${esc(d.breaks.map(b=>b.join('〜')).join(' / '))}</td><td>${hours(Calc.worked(d))}</td><td>${d.flags.map(f=>`<span class="badge flag">${esc(f)}</span>`).join('')}<span class="badge">${esc(d.status)}</span></td></tr>`).join('')}</tbody></table></div></section>`;}
const views={
'打刻':()=>{let d=state.today,open=d.breaks.some(b=>!b[1]),enabled=[!d.start,d.start&&!d.end&&!open,open,d.start&&!d.end&&!open];return `<section><div class="clock"><div id="currentTime" class="big">${clockTime()}</div><p id="currentDate">${dateLabel(today())}</p></div><h2>${d.date&&d.date!==today()?dateLabel(d.date)+"からの勤務記録":"今日の記録"}</h2><dl class="records"><div><dt>出勤</dt><dd>${esc(d.start||"—")}</dd></div>${d.breaks.length?d.breaks.map((b,i)=>`<div><dt>休憩${d.breaks.length>1?" "+(i+1):""}</dt><dd>${esc(b[0])} 〜 ${esc(b[1]||"休憩中")}</dd></div>`).join(""):"<div><dt>休憩</dt><dd>—</dd></div>"}<div><dt>退勤</dt><dd>${esc(d.end||"—")}</dd></div></dl><h2>${!d.start?'今日もよろしくお願いします':d.end?'今日もおつかれさまでした':open?'休憩中です':'勤務中です'}</h2><div class="grid punch">${['出勤','休憩開始','休憩終了','退勤'].map((k,i)=>`<button data-punch="${k}" ${enabled[i]?'':'disabled'}>${['出勤','休憩に入る','休憩から戻る','退勤'][i]}</button>`).join('')}</div><p class="muted">打刻の瞬間だけ位置情報を取得します。取得できない場合も打刻できます。</p>${d.lastTime?`<div class="big">${esc(d.lastTime)}</div><p>${esc(d.lastKind)} を記録しました</p>`:''}</section>${state.balance!==null?`<section><h2>有給の残り</h2><div class="big">${state.balance} 日</div></section>`:''}`;},
'今月の勤怠':attendance,
'修正申請':()=>`<section><h2>打刻の修正を申請</h2>${form('correction',field('日付','date','date',today(),'required')+select('項目','field',['出勤','休憩開始','休憩終了','退勤'])+field('正しい時刻','time','time','','required')+'<label><span>理由（休憩が複数ある日は何回目かも記入）</span><textarea name="reason" required maxlength="1000"></textarea></label>','申請する')}</section><section><h2>申請履歴</h2>${state.requests.map(r=>`<p>${esc(dateLabel(r.日付))} ${esc(r.項目)} ${esc(r.時刻)} <span class="badge">${esc(r.状態)}</span></p>`).join('')||'まだ申請はありません'}</section>`,
'交通費':()=>`<section><h2>交通費を申請</h2>${form('transport',field('月','month','month',state.month,'required')+field('通勤分の金額（円）','amount','number','','min="0" required')+'<label><span>Suicaの利用履歴（写真・PDF、各5MB、最大10件）</span><input type="file" name="files" accept="image/jpeg,image/png,image/heic,image/webp,application/pdf" multiple required></label>','添付して申請')}</section><section><h2>申請履歴</h2>${state.transport.map(r=>`<p>${esc(monthLabel(r.月))} ${yen(r.金額)} <span class="badge">${esc(r.状態)}</span></p>`).join('')||'まだ申請はありません'}</section>`,
'給与明細':()=>state.pays.map(r=>payCard(r,false)).join('')||'<section>確定した給与明細はまだありません。</section>',
'ホーム':()=>{const items=[...state.days.filter(d=>d.status==='未承認'&&d.flags.length).map(d=>({source:'day',date:d.date,staffId:d.staffId,text:d.flags.join('・'),flags:d.flags,start:d.start,end:d.end})),...state.requests.filter(r=>r.状態==='申請中').map(r=>({source:'request',date:r.日付,id:r.ID,staffId:r.スタッフID,text:r.項目+' '+r.時刻+' '+r.理由})),...state.transport.filter(r=>r.状態==='申請中').map(r=>({source:'transport',date:r.申請日時||r.月,id:r.ID,staffId:r.スタッフID,text:monthLabel(r.月)+' '+yen(r.金額),files:r.ファイルID}))].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<section><h2>承認待ち</h2>${(state.forecasts||[]).filter(f=>f.warning||f.error).map(f=>`<p class="badge flag">${esc(nameOf(f.staffId))}：${f.error?esc(f.error):"扶養超え注意 見込み "+yen(f.total)}</p>`).join('')}<p class="muted">勤怠の印は選択月、申請は全期間を表示します。</p>${items.map(r=>`<div class="card"><div><span class="badge kind ${r.source}">${{request:"修正申請",transport:"交通費申請",day:"勤怠の印"}[r.source]}</span></div><strong>${esc(nameOf(r.staffId))}${r.date?" · "+esc(dateLabel(r.date)||monthLabel(r.date)):""}</strong>${r.source==="day"?`<p>${r.flags.map(f=>`<span class="badge flag">${esc(f)}</span>`).join("")}</p><p>出勤 ${esc(r.start||"—")} ／ 退勤 ${esc(r.end||"—")}</p>`:`<p>${esc(r.text)}</p>`}${r.files?String(r.files).split(',').map(id=>id.trim()).filter(Boolean).map((id,i)=>`<a href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view" target="_blank" rel="noopener">Suicaの履歴 ${i+1}を開く</a> `).join(''):''}<div class="toolbar">${['OK','修正して承認','却下'].map(label=>`<button class="${label==='却下'?'reject':''}" data-approve="${esc(JSON.stringify(r))}" data-mode="${label}">${label}</button>`).join('')}</div></div>`).join('')||'<p>承認待ちはありません。</p>'}</section><section><h2>印のない日をまとめて承認</h2>${form('bulk',staffSelect()+field('月','month','month',state.month,'required'),'まとめて承認')}</section>`;},
'勤怠一覧':()=>attendance()+`<section><h2>打刻修正・有給・会社都合の休業</h2><p class="muted">変更前の値・日時・操作者は履歴に残ります。休憩番号は1回目が0、2回目が1です。</p>${form('dayEdit',staffSelect()+field('日付','date','date',today(),'required')+select('区分','type',['勤務','有給','会社都合の休業'])+select('修正する項目','field',[['','区分のみ変更'],'出勤','退勤','休憩開始','休憩終了'])+field('正しい時刻','time','time')+field('休憩番号','index','number',0,'min="0"')+field('休業手当（直前3か月がない場合）','allowance','number','','min="0"'),'変更して承認')}</section>`,
'スタッフ':()=>`<section><h2>スタッフ管理</h2><div class="toolbar">${(state.staff||[]).filter(s=>s.権限!=='管理者').map(s=>`<button class="secondary" data-staff="${esc(s.ID)}">${esc(s.表示名)} (${esc(s.有効)})</button>`).join('')}<button data-staff="">＋追加</button></div><div id="staffEditor">${staffForm()}</div></section><section><h2>有給を付与</h2>${form('grant',staffSelect()+field('付与日','date','date',today(),'required')+field('付与日数','days','number','','min="0" step="0.5" required'))}<p>${state.grants.map(g=>esc(nameOf(g.スタッフID))+' '+esc(dateLabel(g.付与日,true))+' '+g.日数+'日').join('<br>')}</p></section>`,
'時給':()=>`<section><h2>時給の設定</h2><p>適用月がいちばん新しい設定を使います。過去の行は残ります。</p>${form('rateSave',staffSelect()+field('適用開始月','month','month',state.month,'required')+field('時給（円）','rate','number','','min="1" required'),'追加する')}<div class="scroll"><table><tr><th>スタッフ</th><th>適用月</th><th>時給</th></tr>${state.rates.map(r=>`<tr><td>${esc(nameOf(r.スタッフID))}</td><td>${esc(monthLabel(r.適用月))}</td><td>${yen(r.時給)}</td></tr>`).join('')}</table></div></section>`,
'シフト':()=>`<section><h2>${monthLabel(state.month)} のシフト</h2><p class="muted">選択したスタッフの全日を保存します。空欄の日はシフトを削除します。終了時刻が開始より前なら翌日です。</p><form data-action="shiftsSave">${staffSelect()}<button type="button" data-load-shifts class="secondary">選んだスタッフのシフトを表示</button><div class="scroll"><div id="calendar" class="calendar">${calendar(state.staff.filter(s=>s.権限!=='管理者')[0]?.ID)}</div></div><p id="shiftWarning"></p><button>1か月分を保存</button></form></section>`,
'給与計算':()=>`<section class="controls"><h2>${monthLabel(state.month)} の給与</h2>${form('calculate',`<input type="hidden" name="month" value="${state.month}">`,'全員分を計算する')}<p class="muted">未入力の税額表・時給は計算エラーとしてお知らせします。未承認の日・申請がある場合は確定できません。</p></section>${state.pays.filter(r=>r.月===state.month).map(r=>payCard(r,true)).join('')}`,
'帳簿':()=>`<section><h2>帳簿を書き出す</h2>${form('export',select('種類','kind',['出勤簿','賃金台帳','労働者名簿'])+staffSelect('staffId',true)+field('開始日','from','date',state.month+'-01','required')+field('終了日','to','date',today(),'required'),'CSVをダウンロード')}<p class="muted">Excelで開けるBOM付きUTF-8です。労働者名簿は終了日までの入社者を出力します。</p></section>`,
'設定':()=>`<section><h2>お店の設定</h2>${form('settingsSave',Object.entries({緯度:'お店の緯度',経度:'お店の経度',店外距離:'店外とみなす距離（m）',扶養上限:'扶養内の月の上限（円）',交通費上限:'交通費の月の上限（円）',退勤確認:'退勤忘れの確認時刻'}).map(([k,v])=>field(v,k,k==='退勤確認'?'time':'number',state.settings[k],k==='退勤確認'?'required':'step="any"')).join(''))}<p class="muted">源泉税額表はスプレッドシートで入力します。</p></section>`
};
function staffForm(s={}){return form('staffSave',`<input name="id" type="hidden" value="${esc(s.ID||'')}">${s.ID?`<p>ログインID：<strong>${esc(s.表示名||s.ID)}</strong>（表示名でログインします）</p>`:''}`+field('名前','名前','text',s.名前,'required')+field('表示名','表示名','text',s.表示名,'required')+field('入社日','入社日','date',s.入社日)+field('試用期間の終了日','試用終了日','date',s.試用終了日)+select('扶養内を希望','扶養内',['いいえ','はい'],s.扶養内)+select('扶養控除等申告書','税区分',[['甲','提出済み（甲欄）'],['乙','未提出（乙欄）']],s.税区分)+field('契約上の1日の最低勤務時間','最低時間','number',s.最低時間,'min="0" step="0.5"')+select('在籍状況','有効',['はい','退職'],s.有効)+field('暗証番号（編集時は変更する場合のみ）','pin','password','','inputmode="numeric" pattern="[0-9]{4,6}" autocomplete="new-password"'));}
function calendar(staffId){const n=new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5)),0).getDate(),offset=new Date(state.month+'-01T12:00:00').getDay();return ['日','月','火','水','木','金','土'].map(x=>`<b>${x}</b>`).join('')+'<div></div>'.repeat(offset)+Array.from({length:n},(_,i)=>{let date=state.month+'-'+String(i+1).padStart(2,'0'),r=state.shifts.find(r=>r.スタッフID===staffId&&r.日付===date);return `<label data-date="${date}"><span>${i+1}日</span><input aria-label="${date}開始" type="time" data-start value="${esc(r?.開始||'')}"><input aria-label="${date}終了" type="time" data-end value="${esc(r?.終了||'')}"></label>`;}).join('');}
async function locate(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(null);navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),()=>resolve(null),{timeout:10000,maximumAge:0,enableHighAccuracy:true});});}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{let r=await api('login',Object.fromEntries(new FormData(e.target)));token=r.token;localStorage.setItem('attendanceToken',token);e.target.reset();message('');await refresh();});});
$('#logout').onclick=()=>run(async()=>{await api('logout');token='';localStorage.removeItem('attendanceToken');state=null;$('#app').hidden=true;$('#login').hidden=false;$('#logout').hidden=true;message('ログアウトしました');});
$('#refresh').onclick=()=>run(refresh);$('#month').onchange=()=>run(refresh);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.tab){tab=b.dataset.tab;render();}if(b.dataset.staff!==undefined)$('#staffEditor').innerHTML=staffForm(state.staff.find(s=>s.ID===b.dataset.staff));if(b.hasAttribute('data-print'))window.print();if(b.hasAttribute('data-load-shifts'))$('#calendar').innerHTML=calendar(b.form.elements.staffId.value);
 if(b.dataset.punch)run(async()=>{message('位置を確認して記録しています…');let r=await api('punch',{kind:b.dataset.punch,location:await locate()});await refresh();message(r.time+' 記録しました'+(r.duplicate?'（記録済み）':''));});
 if(b.dataset.revoke)run(async()=>{await api('payRevoke',{id:b.dataset.revoke});await refresh();message('確定を取り消しました。履歴に記録しました。');});
 if(b.dataset.approve){let p=JSON.parse(b.dataset.approve),mode=b.dataset.mode;if(mode==='却下'&&!confirm('本当に却下しますか？'))return;p.decision=mode==='却下'?'却下':'承認';if(mode==='修正して承認'){if(p.source==='transport'){p.amount=prompt('承認する金額（円）');if(p.amount===null)return;}else{if(p.source==='day'){p.field=prompt('修正する項目：出勤 / 退勤 / 休憩開始 / 休憩終了','出勤');if(!p.field)return;}p.time=prompt('正しい時刻（HH:MM）');if(!p.time)return;p.index=prompt('休憩の場合は番号（1回目=0、2回目=1）','0');if(p.index===null)return;}}run(async()=>{await api('approve',p);await refresh();message('処理しました');});}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.action)return;e.preventDefault();run(async()=>{let p=Object.fromEntries(new FormData(f)),action=f.dataset.action;
 if(action==='staffSave'){p={id:p.id,pin:p.pin,values:Object.fromEntries(Object.entries(p).filter(([k])=>!['id','pin'].includes(k)))};}
 if(action==='settingsSave')p={values:p};if(action==='paySave')p.finalize=p.finalize==='true';
 if(action==='transport'){const files=[...f.elements.files.files];if(files.length>10)throw Error('添付は10ファイルまでです');p.files=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>5*1024*1024)return reject(Error('1ファイル5MBまでです'));const reader=new FileReader();reader.onerror=()=>reject(Error('添付ファイルを読み込めませんでした'));reader.onload=()=>resolve({name:file.name,type:file.type,data:String(reader.result).split(',')[1]});reader.readAsDataURL(file);})));}
 if(action==='shiftsSave'){p.shifts=[...f.querySelectorAll('[data-date]')].map(el=>({date:el.dataset.date,start:el.querySelector('[data-start]').value,end:el.querySelector('[data-end]').value}));if(p.shifts.some(r=>(r.start||r.end)&&(!r.start||!r.end)))throw Error('開始と終了を両方入力してください');const st=state.staff.find(s=>s.ID===p.staffId);const short=p.shifts.filter(r=>Calc.span(r.start,r.end)<Number(st.最低時間||0)*60);if(short.length)message('注意：最低勤務時間より短いシフト '+short.map(r=>r.date).join('、')+' を保存します。');}
 const r=await api(action,p);if(action==='export'){const url=URL.createObjectURL(new Blob([r.csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=p.kind+'_'+p.from+'_'+p.to+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('CSVを書き出しました');return;}
 await refresh();message(r.errors?.length?'計算できないスタッフがあります：\n'+r.errors.join('\n'):r.id?'保存しました（ログインIDは表示名です）':action==='bulk'?r.count+'日を承認しました':'保存しました');
 });});
document.addEventListener('change',e=>{if(e.target.name==='staffId'&&e.target.form?.dataset.action==='shiftsSave')$('#calendar').innerHTML=calendar(e.target.value);if(e.target.closest('#calendar')){const f=e.target.closest('form'),st=state.staff.find(s=>s.ID===f.elements.staffId.value);$('#shiftWarning').textContent=[...f.querySelectorAll('[data-date]')].some(el=>{let a=el.querySelector('[data-start]').value,b=el.querySelector('[data-end]').value;return a&&b&&Calc.span(a,b)<Number(st?.最低時間||0)*60;})?'注意：契約上の最低勤務時間より短いシフトがあります（保存できます）。':'';}});
if(token)run(refresh);
</script></body></html>
