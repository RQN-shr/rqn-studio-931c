<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#85C8FE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日のタスク">
<title>今日のタスク — R.QueenNail</title>
<style>
  :root{
    --ink:#3c4d5c; --ink-soft:#7a8c9a;
    --blue-deep:#4f9be0; --blue-mist:#eaf4fd; --slate:#55758A;
    --line:#e4eef6; --paper:#ffffff;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:#f7fbff;min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:600px;margin:0 auto;padding:22px 16px 70px}

  header{display:flex;align-items:baseline;justify-content:space-between;
    padding:4px 4px 14px;border-bottom:1px solid var(--line)}
  h1{font-size:20px;font-weight:700;letter-spacing:.06em}
  .stamp{font-size:12px;color:var(--ink-soft)}

  .addbar{display:flex;gap:8px;margin:14px 0 4px}
  .addbar input{flex:1;font-family:var(--sans);font-size:15px;color:var(--ink);
    padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
  .addbar input:focus{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(133,200,254,.18)}
  .addbar button{flex:0 0 auto;font-family:var(--sans);font-size:14px;font-weight:700;color:#fff;
    background:var(--blue-deep);border:none;border-radius:10px;padding:0 18px;cursor:pointer}
  .addbar button:active{opacity:.85}

  .sec-head{display:flex;align-items:center;gap:8px;margin:22px 2px 4px;
    font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--slate)}
  .sec-head .count{font-weight:600;font-size:11px;color:var(--blue-deep);
    background:var(--blue-mist);border-radius:999px;padding:1px 8px}

  ul{list-style:none}
  li.item{display:flex;align-items:flex-start;gap:12px;
    padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  li.item:active{background:#f0f7ff}
  .box{flex:0 0 auto;width:22px;height:22px;margin-top:1px;border-radius:6px;
    border:1.6px solid var(--blue-deep);background:#fff;position:relative;transition:all .15s ease}
  .box::after{content:"";position:absolute;left:6.5px;top:2.5px;width:6px;height:11px;
    border:solid #fff;border-width:0 2.3px 2.3px 0;transform:rotate(45deg) scale(0);transition:transform .15s ease}
  li.done .box{background:var(--blue-deep);border-color:var(--blue-deep)}
  li.done .box::after{transform:rotate(45deg) scale(1)}
  .txt{flex:1;min-width:0}
  .txt .main{font-size:15px;line-height:1.5;color:var(--ink)}
  .txt .note{margin-top:3px;font-size:12px;line-height:1.55;color:var(--ink-soft)}
  .txt .added{margin-top:4px;font-size:11px;color:#a8b6c2;letter-spacing:.04em}
  li.done .txt .main{text-decoration:line-through;color:#b3c1cd}
  li.done{opacity:.6}
  .pill{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;
    font-size:10.5px;vertical-align:middle;background:var(--blue-mist);color:var(--slate)}
  .pill.wait{background:#fdf1dc;color:#9a7b3a}
  .pill.me{background:#e6f6ec;color:#3f8f5f}
  .pill.mine{background:#eaf4fd;color:#4f9be0}
  .del{flex:0 0 auto;font-size:18px;line-height:1;color:#c4d2de;padding:0 2px;margin-top:1px}
  .del:active{color:#9a7b3a}

  .foot{margin-top:26px;text-align:center;font-size:12px;line-height:1.8;color:var(--ink-soft)}
  .empty{padding:14px 4px;font-size:13px;color:var(--ink-soft)}

  #gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#f7fbff;padding:0 26px;text-align:center}
  #gate h2{font-size:18px;font-weight:700;letter-spacing:.06em}
  #gate p{font-size:12px;color:var(--ink-soft)}
  #pin{font-family:var(--sans);font-size:24px;letter-spacing:.5em;text-align:center;
    width:190px;padding:12px 10px 12px 20px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
  #pin:focus{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(133,200,254,.22)}
  #gate .err{color:#d98a8a;font-size:12px;min-height:16px}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="gate">
  <h2>今日のタスク</h2>
  <p>あんしんロック（この端末は次回から自動で開きます）</p>
  <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="＿＿＿＿" autocomplete="off">
  <div class="err" id="pinErr"></div>
</div>

<div class="wrap hidden" id="app">
  <header>
    <h1>今日のタスク</h1>
    <span class="stamp" id="stamp"></span>
  </header>

  <div class="addbar">
    <input id="newtask" type="text" placeholder="＋ 新しいタスクを追加" autocomplete="off">
    <button id="addbtn">追加</button>
  </div>

  <main id="lists"></main>

  <div class="foot">完了したものは、翌日この一覧から消えます。<br>つむに言えば、私が足したり直したりもできます。</div>
</div>

<script>
/* ===== 設定 ===== */
const PIN = "0117";
const UPDATED = "8/5 更新";

/* ===== つむが管理するタスク（編集する場所） ===== */
const DATA = [
  { title:"今日やること", items:[
    {main:"リジョブ求人票のSTEP2を埋める", note:"雇用契約書づくりで給与・勤務条件が全部確定しました（時給1,150円〜＋資格手当、週2日1日5時間〜、通勤費月5,000円まで）。もう埋められる状態です。8/27までに申請", tag:"つむと", added:"2026-08-03"},
    {main:"求人広告の“お手本動画”を見る", note:"見たら、その型で求人票をつむと仕上げる"},
  ]},
  { title:"やりかけ・進行中", items:[
    {main:"採用書類4点セットを社労士さんに見てもらう", note:"雇用契約書・勤務規程・秘密保持誓約書・肖像同意書。条件は全部決まりました。押印の前に確認だけお願いします。特に見てほしいのは①有期契約の更新条項 ②資格取得支援を「貸付＋2年勤続で免除」にした部分 ③退職申出の3か月前の書き方", tag:"つむと", added:"2026-08-11"},
    {main:"求人票に「在職中は他店勤務・自宅サロン不可」を1行入れる", note:"他店も自宅サロンも禁止で決めたので、募集要項に先に書いておきます。面接まで伏せると内定のところで破談になります。復帰組の応募者に自宅サロンの方がいる可能性が高いので早めに", tag:"つむと", added:"2026-08-11"},
    {main:"新店舗の写真を撮る", note:"施術風景・カラージェル棚・外観・内観の別カット。リジョブに入れた画像は内観1枚以外まだ旧店舗のもの。撮れたら差し替えます", added:"2026-08-05"},
    {main:"求人バナーを2か所直す", note:"「1日3時間〜」→「1日5時間〜」、「プロフィールへ」→「求人の詳細はこちら」。リジョブのSNSシェア用にCanvaで複製して修正", added:"2026-08-05"},
    {main:"ジェルネイル集客LPを仕上げる", note:"2版のどちらが正か決める→爪写真10枠→公開先決定", tag:"つむと"},
    {main:"6〜8月の支出をまとめて入力する", note:"推移シートの原価・販管費が3期に入ってから一度も入っていません（＝利益が見えない状態）。確定申告フォルダの 2026_6／2026_7／2026_8 に、領収書・Suica履歴・楽天カード・AMEX（ビジネスゴールド＋マリオット）を入れてもらえたら3ヶ月分まとめてやります", tag:"つむと", added:"2026-08-31"},
    {main:"8月分の広告効果測定（9/3以降）", note:"Google広告の自動記入スクリプトが動くのが毎月3日。9/3を過ぎたら費用・表示・クリック・CVは入っているので、LINEとエルメの数字だけ画面で見せてもらえれば終わります。8月の売上入力とシフトは完了済み", tag:"つむと", added:"2026-08-31"},
    {main:"freeeの修正内容を税理士さんに共有する", note:"グルナディエの2026年1〜8月を報告書どおりに直しました。①横須賀の管理料を税抜8,700→税込9,570に統一 ②1〜3月分に入っていた清掃代4,400を削除（報告書に無いため）③共用部電気料金を新たに計上 ④アイケン4・5月度など日付のズレを修正 ⑤5月度の収入にルームクリーニング代66,000を追加。決算前にリリーフさんへ一報を", tag:"つむと", added:"2026-08-25"},
    {main:"営業時間の表記を直す（残り3か所）", note:"正しくは「11:00〜20:00（最終受付18:30）／定休日 日曜・月曜」。①深爪LPトップ＝テーマファイル内なのでつむは編集不可（今は18:30閉店に読める表記）②エルメの配信文・予約案内 ③ネイルブック。求人ページとジェルLPは反映済み", tag:"つむと", added:"2026-08-03"},
    {main:"今田塾に「キャンセル数」の計測方法を聞く", note:"広告計測シートのキャンセル欄。エルメに該当タグがないので毎月空欄のまま", added:"2026-08-03"},
    {main:"SY様のお客さまの声でリール動画", note:"「5回で確信に変わった」の素材。構成相談中"},
    {main:"スタンプカードのアプリ化", note:"GAS＋Googleシート。次はコード作成から"},
    {main:"証券口座の開設を進める", note:"さちさんの戦略メモに沿って。1社ずつ"},
    {main:"自宅の売却→次は不動産か株か検討", note:"山本さんの査定書待ち"},
  ]},
  { title:"反映・返事待ち", items:[
    {main:"レジェイドビオの出方を待つ", note:"「1番手と進める」の真偽待ち。いけそうなら山本さんへ連絡", tag:"待ち", added:"2026-08-03"},
    {main:"ファミーユ西船橋のリフォーム資料", note:"資料請求中。届いたら一緒に見ます", tag:"待ち", added:"2026-08-03"},
    {main:"MEO業者さんのGBP営業時間の反映", note:"8/3にLINEで依頼済み。11:00〜20:00／定休日 日曜・月曜／最終受付18:30", tag:"待ち", added:"2026-08-03"},
  ]},
];

/* ===== 保存領域 ===== */
const DONE_KEY = "rqn-done-v2";     // key -> 完了した日付("YYYY-MM-DD")
const UT_KEY   = "rqn-usertasks-v1"; // 自分で追加したタスク
function load(k,def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
let done = load(DONE_KEY, {});
let userTasks = load(UT_KEY, []);

function todayStr(){
  const d=new Date(), p=n=>(n<10?"0":"")+n;
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
const TODAY = todayStr();
const SEED_DATE = "2026-07-13"; // つむ管理タスクをこの一覧に載せた日
/* 完了記録は消さずに残す。→ 完了日が今日なら線を引いて表示、
   完了日が昨日以前なら一覧から隠す（＝翌日に消える） */

function mdOf(s){ if(!s) return ""; const p=String(s).split("-"); return p.length===3 ? (Number(p[1])+"/"+Number(p[2])) : ""; }
function dateFromId(id){ const n=Number(id); if(!n) return ""; const d=new Date(n),p=x=>(x<10?"0":"")+x; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

function tagClass(t){ if(!t) return ""; if(t.indexOf("待ち")>=0) return "wait"; if(t.indexOf("つむ")>=0) return "me"; return ""; }
function esc(s){ return s.replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function itemHTML(key, main, note, tag, tagCls, isUser, added){
  const isDone = done[key] === TODAY;
  const pill = tag ? `<span class="pill ${tagCls}">${tag}</span>` : "";
  const del  = isUser ? `<span class="del" data-del="${key}">×</span>` : "";
  const noteH = note ? `<div class="note">${esc(note)}</div>` : "";
  const md = mdOf(added);
  const addedH = md ? `<div class="added">${md} 追加</div>` : "";
  return `<li class="item ${isDone?'done':''}" data-k="${encodeURIComponent(key)}">
    <span class="box"></span>
    <span class="txt"><span class="main">${esc(main)}${pill}</span>${noteH}${addedH}</span>${del}
  </li>`;
}

function render(){
  document.getElementById("stamp").textContent = UPDATED;
  let html = "";

  // 自分で追加したタスク（今日完了ぶんは残す・過去完了は cleanup 済み）
  const mine = userTasks.filter(t => !( done["u:"+t.id] && done["u:"+t.id] !== TODAY ));
  if(mine.length){
    const open = mine.filter(t=>done["u:"+t.id]!==TODAY).length;
    html += `<div class="sec-head">追加したタスク<span class="count">${open}</span></div><ul>`;
    mine.forEach(t=> html += itemHTML("u:"+t.id, t.main, "", "自分", "mine", true, t.added || dateFromId(t.id)));
    html += "</ul>";
  }

  // つむ管理ぶん
  DATA.forEach(sec=>{
    const vis = sec.items.filter(it => !(done[it.main] && done[it.main] !== TODAY));
    if(!vis.length) return;
    const open = vis.filter(it=>done[it.main]!==TODAY).length;
    html += `<div class="sec-head">${sec.title}<span class="count">${open}</span></div><ul>`;
    vis.forEach(it=> html += itemHTML(it.main, it.main, it.note, it.tag, tagClass(it.tag), false, it.added || SEED_DATE));
    html += "</ul>";
  });

  if(!html) html = `<div class="empty">今日のタスクは空っぽです。上の欄から追加できます。</div>`;
  document.getElementById("lists").innerHTML = html;

  document.querySelectorAll("li.item").forEach(li=>{
    li.addEventListener("click", (e)=>{
      if(e.target.classList.contains("del")){
        const dk = e.target.getAttribute("data-del");
        userTasks = userTasks.filter(t => ("u:"+t.id) !== dk);
        delete done[dk]; save(UT_KEY,userTasks); save(DONE_KEY,done); render(); return;
      }
      const k = decodeURIComponent(li.dataset.k);
      if(done[k]) delete done[k]; else done[k] = TODAY;
      save(DONE_KEY, done); render();
    });
  });
}

/* 追加 */
function addTask(){
  const inp = document.getElementById("newtask");
  const v = inp.value.trim();
  if(!v) return;
  userTasks.unshift({ id: Date.now().toString(), main: v, added: TODAY });
  save(UT_KEY, userTasks); inp.value=""; render(); inp.focus();
}
document.getElementById("addbtn").addEventListener("click", addTask);
document.getElementById("newtask").addEventListener("keydown", e=>{ if(e.key==="Enter") addTask(); });

/* ===== PIN ===== */
const UNLOCK_KEY = "rqn-tasks-unlocked-v1";
const gate = document.getElementById("gate"), app = document.getElementById("app");
function unlock(){ gate.classList.add("hidden"); app.classList.remove("hidden"); render(); }
if(localStorage.getItem(UNLOCK_KEY) === "1"){ unlock(); }
else {
  const pin = document.getElementById("pin"); pin.focus();
  pin.addEventListener("input", ()=>{
    if(pin.value.length === 4){
      if(pin.value === PIN){ localStorage.setItem(UNLOCK_KEY,"1"); unlock(); }
      else { document.getElementById("pinErr").textContent = "番号がちがうみたい"; pin.value=""; }
    } else { document.getElementById("pinErr").textContent = ""; }
  });
}
</script>
</body>
</html>
